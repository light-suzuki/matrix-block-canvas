name: Browser Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chrome-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build production site and portable HTML
        run: npm run portable
      - name: Install Playwright test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          node -p "'Playwright ' + require('@playwright/test/package.json').version"
      - name: Confirm system Chrome on Linux
        if: runner.os == 'Linux'
        run: google-chrome --version
      - name: Run generation, publication layout, and export regressions
        run: npx playwright test
      - name: Upload browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
