name: Refresh lockfile once

on:
  push:
    branches: [complete-windows-portability]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-windows-portability
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh Vite patch and lockfile
        run: npm install vite@6.4.3 --save-exact --package-lock-only
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git commit -m "chore: patch Vite to 6.4.3"
          git push origin HEAD:complete-windows-portability
