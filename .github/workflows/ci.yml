name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate application and portable build
        run: npm run check
      - name: Verify portable artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MatrixBlockCanvas-portable.html")) {
            throw "Portable HTML was not generated."
          }
