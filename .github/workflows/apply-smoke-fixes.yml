name: Apply smoke-test fixes once

on:
  push:
    branches: [e2e-smoke-test]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e2e-smoke-test
      - name: Treat group as TSV marker metadata
        shell: python
        run: |
          from pathlib import Path

          parser = Path('src/ggtTemplates.ts')
          text = parser.read_text(encoding='utf-8')
          old = 'if (isMetaRow(tag, ["chr", "chrom", "chromosome"])) {'
          new = 'if (isMetaRow(tag, ["chr", "chrom", "chromosome", "group"])) {'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not find TSV chromosome/group meta-row parser target')
          parser.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ggtTemplates.ts
          if git diff --cached --quiet; then
            echo "Fix already applied."
            exit 0
          fi
          git commit -m "fix: recognize group as TSV marker metadata"
          git push origin HEAD:e2e-smoke-test
