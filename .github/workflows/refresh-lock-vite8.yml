name: Refresh Vite 8 lockfile once

on:
  push:
    branches: [complete-windows-portability]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: complete-windows-portability
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile from package.json
        run: npm install --package-lock-only
      - name: Verify no high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for Vite 8"
          git push origin HEAD:complete-windows-portability
